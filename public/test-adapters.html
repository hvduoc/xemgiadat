<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Adapter Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .success { color: #4caf50; }
        .error { color: #f44336; }
        .info { color: #2196f3; }
        pre { 
            background: #2d2d2d; 
            padding: 15px; 
            border-radius: 8px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🧪 Adapter Load Test</h1>
    <pre id="output">Testing...</pre>

    <!-- Load Leaflet first -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.vectorgrid@1.3.0/dist/Leaflet.VectorGrid.bundled.js"></script>

    <!-- Load adapters (synchronous) -->
    <script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
    <script src="js/adapters/PMTilesAdapter.js"></script>
    <script src="js/adapters/GeocodingAdapter.js"></script>
    <script src="js/adapters/FeatureFlagConfig.js"></script>

    <script>
        const output = document.getElementById('output');
        let log = '';

        function print(message, type = 'info') {
            const line = `<span class="${type}">${message}</span>\n`;
            log += line;
            output.innerHTML = log;
            console.log(message);
        }

        // Test all components
        setTimeout(() => {
            print('=== Adapter Load Test ===\n', 'info');
            
            // Check PMTiles
            const pmtilesOK = typeof pmtiles !== 'undefined';
            print(`1. PMTiles library: ${pmtilesOK ? '✅ LOADED' : '❌ NOT LOADED'}`, pmtilesOK ? 'success' : 'error');
            
            // Check Leaflet
            const leafletOK = typeof L !== 'undefined' && L.vectorGrid;
            print(`2. Leaflet VectorGrid: ${leafletOK ? '✅ LOADED' : '❌ NOT LOADED'}`, leafletOK ? 'success' : 'error');
            
            // Check VectorTileConfig
            const vectorConfigOK = typeof VectorTileConfig !== 'undefined';
            print(`3. VectorTileConfig: ${vectorConfigOK ? '✅ LOADED' : '❌ NOT LOADED'}`, vectorConfigOK ? 'success' : 'error');
            if (vectorConfigOK) {
                try {
                    const config = VectorTileConfig.getConfig();
                    print(`   - Mode: ${config.mode}`, 'info');
                    print(`   - PMTiles supported: ${config.pmtilesSupported}`, 'info');
                } catch (e) {
                    print(`   - Error: ${e.message}`, 'error');
                }
            }
            
            // Check GeocodingService
            const geocodingOK = typeof GeocodingService !== 'undefined';
            print(`4. GeocodingService: ${geocodingOK ? '✅ LOADED' : '❌ NOT LOADED'}`, geocodingOK ? 'success' : 'error');
            if (geocodingOK) {
                try {
                    const config = GeocodingService.getConfig();
                    print(`   - Mode: ${config.mode}`, 'info');
                    print(`   - Cache size: ${config.cacheSize}`, 'info');
                } catch (e) {
                    print(`   - Error: ${e.message}`, 'error');
                }
            }
            
            // Check OpenSourceConfig
            const openSourceOK = typeof OpenSourceConfig !== 'undefined';
            print(`5. OpenSourceConfig: ${openSourceOK ? '✅ LOADED' : '❌ NOT LOADED'}`, openSourceOK ? 'success' : 'error');
            if (openSourceOK) {
                try {
                    const status = OpenSourceConfig.getStatus();
                    print(`   - Tiles: ${status.tiles}`, 'info');
                    print(`   - Geocoding: ${status.geocoding}`, 'info');
                    print(`   - Mode: ${status.mode}`, 'info');
                } catch (e) {
                    print(`   - Error: ${e.message}`, 'error');
                }
            }
            
            print('\n=== Summary ===', 'info');
            const allOK = pmtilesOK && leafletOK && vectorConfigOK && geocodingOK && openSourceOK;
            if (allOK) {
                print('✅ ALL ADAPTERS LOADED SUCCESSFULLY!', 'success');
                print('\nYou can now use:', 'info');
                print('  OpenSourceConfig.getStatus()', 'info');
                print('  await OpenSourceConfig.test()', 'info');
                print('  OpenSourceConfig.enableTilesOnly()', 'info');
            } else {
                print('❌ SOME ADAPTERS FAILED TO LOAD', 'error');
                print('Check browser console for errors', 'error');
            }
            
        }, 500);
    </script>
</body>
</html>
