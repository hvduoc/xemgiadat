[build]
publish = "public"
functions = "netlify/functions"

# ⚡ Performance Optimization
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

[context.production.environment]
  NODE_ENV = "production"
  SITE_URL = "https://xemgiadat.com"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/proxy/*"
  to = "/.netlify/functions/proxy/:splat"
  status = 200

[[redirects]]
  from = "/pi-verify"
  to = "/.netlify/functions/pi-verify"
  status = 200

[[redirects]]
  from = "/og.html"
  to = "/og.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ========================================
# CACHE HEADERS - CRITICAL FOR SAFETY
# ========================================

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cache-Control = "public, max-age=3600, must-revalidate"

# HTML pages - NEVER cache
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# manifest.json - PWA manifest must stay fresh
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

# Service Worker - NEVER cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Non-hashed JS files - 24h cache with revalidation
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=86400, must-revalidate"

# Hash-busted JS files from build - 1 year immutable cache
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

# Non-hashed CSS files - 24h cache with revalidation
[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=86400, must-revalidate"

# Hash-busted CSS files from build - 1 year immutable cache
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

# PMTiles vector tiles - 30 days cache with Range request support
[[headers]]
  for = "/tiles/*.pmtiles"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=2592000"
    Access-Control-Allow-Origin = "*"
    Accept-Ranges = "bytes"

# Tile metadata - short cache with revalidation
[[headers]]
  for = "/tiles/metadata.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600, must-revalidate"
    Access-Control-Allow-Origin = "*"

# Other tile resources - standard protobuf format
[[headers]]
  for = "/tiles/*"
  [headers.values]
    Content-Type = "application/x-protobuf"
    Access-Control-Allow-Origin = "*"

# Netlify Functions - CORS headers for API calls
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://xemgiadat.com"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-Pi-Signature"
