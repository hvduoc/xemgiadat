[build]
publish = "public"
functions = "netlify/functions"

# Performance Optimization
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

[context.production.environment]
  NODE_ENV = "production"
  SITE_URL = "https://xemgiadat.com"

# ═══════════════════════════════════════════════════════════════════════════════
# REDIRECTS - Order matters! More specific rules first, catch-all LAST
# ═══════════════════════════════════════════════════════════════════════════════

# --- SERVERLESS FUNCTIONS ---
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/proxy/*"
  to = "/.netlify/functions/proxy/:splat"
  status = 200

[[redirects]]
  from = "/pi-verify"
  to = "/.netlify/functions/pi-verify"
  status = 200

# --- STATIC ASSET PASS-THROUGH (MUST BE BEFORE SPA CATCH-ALL!) ---
[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200

[[redirects]]
  from = "/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/v2/assets/*"
  to = "/v2/assets/:splat"
  status = 200

[[redirects]]
  from = "/tiles/*"
  to = "/tiles/:splat"
  status = 200

[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200

# --- V2 APP ROUTING ---
[[redirects]]
  from = "/v2/*"
  to = "/v2/:splat"
  status = 200

[[redirects]]
  from = "/v2"
  to = "/v2/"
  status = 301

# --- SPA FALLBACK - MUST BE LAST! ---
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ═══════════════════════════════════════════════════════════════════════════════
# HEADERS
# ═══════════════════════════════════════════════════════════════════════════════

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/js/*"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/adapters/*"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/tiles/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
